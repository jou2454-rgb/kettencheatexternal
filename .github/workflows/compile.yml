name: Build

on:
  push:
    branches: [ "main", "ccr-*" ]
    paths-ignore:
      - "bycmd/build/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c

      - name: ndk-build
        run: |
          cd bycmd
          ndk-build -j4 NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk
          ls -la libs/arm64-v8a/eeeww
          sha256sum libs/arm64-v8a/eeeww
          readelf -lW libs/arm64-v8a/eeeww | grep -E "LOAD|Align"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: eeeww-arm64
          path: bycmd/libs/arm64-v8a/eeeww

      - name: Commit binary to branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p bycmd/build
          cp bycmd/libs/arm64-v8a/eeeww bycmd/build/eeeww
          sha256sum bycmd/build/eeeww > bycmd/build/eeeww.sha256
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bycmd/build/eeeww bycmd/build/eeeww.sha256
          git diff --cached --quiet && echo "binary unchanged" && exit 0
          git commit -m "build: eeeww arm64 from ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
