name: build-rise-esp

on:
  push:
    paths:
      - 'rise_esp/**'
      - '.github/workflows/build-rise.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android NDK r27c
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Build (ndk-build, arm64-v8a)
        working-directory: rise_esp/android
        run: |
          ndk-build NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./jni/Android.mk \
            NDK_APPLICATION_MK=./jni/Application.mk \
            -j"$(nproc)"
          ls -l libs/arm64-v8a

      - name: Upload rise_esp
        uses: actions/upload-artifact@v4
        with:
          name: rise-esp-arm64
          path: rise_esp/android/libs/arm64-v8a/rise_esp
