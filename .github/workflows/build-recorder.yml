name: Build ScreenRec APK

on:
  push:
    branches: [ "main", "claude/*" ]
    paths:
      - 'recorder/**'
      - '.github/workflows/build-recorder.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: |
          cd recorder
          chmod +x gradlew 2>/dev/null || true
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: |
          mkdir -p output
          cp recorder/app/build/outputs/apk/debug/app-debug.apk output/ScreenRec.apk
          ls -la output/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screenrec-apk
          path: output/ScreenRec.apk
